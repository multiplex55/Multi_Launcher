[package]
name = "multi_launcher"
version = "0.1.0"
edition = "2024"
build = "build.rs"
autobins = false
default-run = "multi_launcher"

[[bin]]
name = "multi_launcher"
path = "src/main.rs"

[[bin]]
name = "coordinate_tool_smoke"
path = "src/bin/coordinate_tool_smoke.rs"
required-features = ["dev-smoke-binaries"]

[[bin]]
name = "passive_overlay_smoke"
path = "src/bin/passive_overlay_smoke.rs"
required-features = ["dev-smoke-binaries"]

[[bin]]
name = "pin_opacity_smoke"
path = "src/bin/pin_opacity_smoke.rs"
required-features = ["dev-smoke-binaries"]

[[bin]]
name = "image_compare_smoke"
path = "src/bin/image_compare_smoke.rs"
required-features = ["dev-smoke-binaries"]

[[bin]]
name = "duplicate_finder_smoke"
path = "src/bin/duplicate_finder_smoke.rs"
required-features = ["dev-smoke-binaries"]

[[bin]]
name = "radial_acceptance"
path = "src/bin/radial_acceptance.rs"
required-features = ["dev-smoke-binaries"]

[[bin]]
name = "perf_probe_runner"
path = "src/bin/perf_probe_runner.rs"
required-features = ["perf-harness"]

[[bin]]
name = "perf_hotfolder_probe"
path = "src/bin/perf_hotfolder_probe.rs"
required-features = ["perf-harness"]

[[bin]]
name = "perf_radial_probe"
path = "src/bin/perf_radial_probe.rs"
required-features = ["perf-harness"]

[[bin]]
name = "perf_dashboard_probe"
path = "src/bin/perf_dashboard_probe.rs"
required-features = ["perf-harness"]

# Isolated fixture generation and typed safety checks for the M01 GUI harness.
[[bin]]
name = "jump_mode_fixture"
path = "dev/jump_mode/fixture_generator/src/main.rs"
required-features = ["dev-smoke-binaries"]

[dependencies]
eframe = {
    version = "0.36.2",
    default-features = false,
    features = [
        "accesskit",
        "default_fonts",
        "glow",
        "links",
        "wayland",
        "web_screen_reader",
        "x11",
    ],
} # egui-based GUI; preserve Glow instead of enabling the new Wgpu default
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.4"
fuzzy-matcher = "0.3"
fst = { version = "0.4", features = ["levenshtein"] }
open = "5.0"                   # Open files/folders/apps cross-platform
anyhow = "1.0"
walkdir = "2.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tracing-appender = "0.2"
exmex = "0.20"
libloading = "0.8"
notify = "6"
winit = "0.30.13"
once_cell = "1"
regex = "1"
regex-syntax = "0.8"
regex-automata = { version = "0.4", default-features = false, features = ["alloc"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
slug = "0.1"
hashlink = "0.8"
siphasher = "0.3"
urlencoding = "2"
url = "2"
windows = { version = "0.58", features = [
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "System_UserProfile",
    "Foundation_Collections",
    "Storage_Streams",
    "Security_Cryptography",
    "Data_Xml_Dom",
    "UI_Notifications",
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Magnification",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemServices",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_Data_Xml_MsXml",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell_Common",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Devices_Display",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_Storage_FileSystem",
] }
log = "0.4"
raw-window-handle = "0.6"
arboard = "3"
egui-toast = { version = "0.22.0", default-features = false }
egui_extras = {
    version = "0.36.2",
    default-features = false,
    features = ["file"],
}
figlet-rs = "0.1"
dirs-next = "2"
shlex = "1.3"
similar = "2.7"
unicode-segmentation = "1.12"
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }
# `trash` deliberately fails its Windows build unless one COM apartment model
# is selected. Keep the optional chrono integration disabled while matching
# the crate's default, UI-friendly apartment-threaded initialization.
trash = { version = "5.2", default-features = false, features = ["coinit_apartmentthreaded"] }
sysinfo = "0.35"
chrono = "0.4"
screenshots = "0.8.10"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "bmp", "ico", "gif", "tiff"] }
# Keep egui_extras' image 0.25 loader on the decoder formats used before the egui upgrade.
# This stays separate from image 0.24, which screenshot and application paths still use.
image_025 = { package = "image", version = "0.25.6", default-features = false, features = [
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "tga",
    "tiff",
    "webp",
] }
tempfile = "3"
ipconfig = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
base64 = "0.21"
hex = "0.4"
rand = "0.10.1"
lipsum = "0.9"
egui_commonmark = {
    version = "0.25.0",
    default-features = false,
    features = ["load-images", "pulldown_cmark"],
}
rfd = { version = "0.15.3", features = ["common-controls-v6"] }
slab = "0.4.11"
rdev = { git = "https://github.com/Narsil/rdev", rev = "c14f2dc5c8100a96c5d7e3013de59d6aa0b9eae2", features = ["x11"] }
rodio = { version = "0.17", default-features = false, features = ["wav"] }
ab_glyph = "0.2"
time = ">=0.3.47, <0.4"
bytes = ">=1.11.1, <2"
sha2 = "0.10"
sha1 = "0.10"
qrcode = { version = "0.14.1", default-features = false }

[features]
unstable_grab = ["rdev/unstable_grab"]
qa-framebuffer-capture = []
dev-smoke-binaries = []
perf-harness = [
    "windows/Win32_System_JobObjects",
    "windows/Win32_System_Pipes",
    "windows/Win32_System_IO",
]

[dev-dependencies]
image = { version = "0.24", default-features = false, features = ["jpeg"] }
criterion = "0.5"
serial_test = "2"

[build-dependencies]
embed-resource = "2"

[[bench]]
name = "search"
harness = false

[[bench]]
name = "omni_search"
harness = false
[[bench]]
name = "todo_widget_filtering"
harness = false

[[bench]]
name = "radial_runtime"
harness = false

# Group only side-effect-free cases; Cargo auto-discovers every top-level tests/*.rs target.
[[test]]
name = "plugin_queries"
path = "tests/suites/plugin_queries.rs"

[[test]]
name = "domain"
path = "tests/suites/domain.rs"

[[test]]
name = "pure"
path = "tests/suites/pure.rs"

# One reduced-symbol candidate shared by iterative launcher builds and Nextest.
# Inheriting dev keeps its safety checks and other development settings.
[profile.fast-dev]
inherits = "dev"
debug = "line-tables-only"

# Measured opt-in local iteration profile; canonical release stays unchanged.
[profile.iteration]
inherits = "release"
opt-level = 2
codegen-units = 64
lto = "off"
incremental = true

# Local lifecycle seam for hidden-root prompt viewport bootstrapping.
[patch.crates-io]
epaint = { path = "vendor/epaint" }
egui = { path = "vendor/egui" }
eframe = { path = "vendor/eframe" }
# Align image 0.25 DDS capability reporting with its existing decoder.
image = { path = "vendor/image" }
# Preserve toast hover-pause behavior with egui 0.36's full-rect close interaction.
egui-toast = { path = "vendor/egui-toast" }
